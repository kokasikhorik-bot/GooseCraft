name: Native builds and rendering
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.os }} / x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.12.14'
          - os: windows-2022
            python: '3.12.10'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install pinned build helper
        run: python -m pip install -r tools/requirements.txt
      - name: Build pinned Goose and fetch optional graphics sources
        run: python tools/bootstrap.py --jobs 2 ${{ runner.os == 'Windows' && '--graphics' || '' }}
      - name: Compile release and debug graphical Windows clients without opening a window
        if: runner.os == 'Windows'
        run: python tools/project.py render-build
      - name: Test core, chunk seams and saved worlds without a display
        run: python tools/project.py test
      - name: Measure native meshing without a display
        run: python tools/project.py benchmark --evidence build/benchmarks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-${{ matrix.os }}-x64-${{ github.sha }}
          path: build/benchmarks/
          if-no-files-found: error
      - name: Prepare native distribution
        run: python tools/project.py package ${{ runner.os == 'Windows' && '--graphics' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goosecraft-${{ matrix.os }}-x64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
  graphics:
    name: Linux / software Vulkan and X11
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build pinned graphics environment
        run: docker build --target graphics -f .devcontainer/Dockerfile -t goosecraft-graphics .
      - name: Check multi-chunk rendering, culling and persistence in Vulkan and Xvfb
        run: |
          mkdir -p graphics-results
          docker run --rm --network=none --mount "type=bind,src=$PWD/graphics-results,dst=/results" goosecraft-graphics python tools/project.py render-test --evidence /results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: graphics-evidence-${{ github.sha }}
          path: graphics-results/
          if-no-files-found: error
