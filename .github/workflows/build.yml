name: Native headless builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.os }} / x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          architecture: x64
      - name: Install pinned build helper
        run: python -m pip install -r tools/requirements.txt
      - name: Build pinned Goose (no GUI packages)
        run: python tools/bootstrap.py --jobs 2
      - name: Build and test without a display
        run: python tools/project.py test
      - name: Prepare native distribution
        run: python tools/project.py package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goosecraft-${{ matrix.os }}-x64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
